name: Ondo Funding-Rate sammeln

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bibliotheken installieren
        run: pip install requests

      - name: Ondo-Daten abholen
        run: python ondo_collector.py

      - name: Aktualisierte Datei speichern
        run: |
          git config user.name "ondo-collector-bot"
          git config user.email "actions@github.com"
          git add ondo_funding_history.json
          git diff --quiet --cached || git commit -m "Ondo Funding-Rate Update"
          git push
